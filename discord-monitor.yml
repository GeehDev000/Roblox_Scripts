
name: Discord Repository Auditor

on:
  push:
    branches:
      - '**'

  pull_request:
    types: [opened, reopened, synchronize, closed, edited]

  issues:
    types: [opened, closed, edited, reopened]

  release:
    types: [published, edited]

  workflow_run:
    workflows: ["CI", "Tests", "Build"]
    types: [completed]

# ==========================================================
# CONFIGURAÇÃO CENTRAL
# Edite esta seção para personalizar o monitoramento.
# ==========================================================

env:

  # ---------------- WEBHOOK ----------------

  DISCORD_WEBHOOK: ${{https://discord.com/api/webhooks/1569893035146485921/FSjaapE8SSU5g1C18eCVvLd-eboxxPO9iaBLtgMZ8vq1vQYN5Q9Gbm_v9QxYUg0eXV0Z}}
  DISCORD_USERNAME: "Scripts Auditor"

  # ---------------- EVENTOS ----------------

  MONITOR_PUSH: "true"
  MONITOR_PULL_REQUESTS: "true"
  MONITOR_ISSUES: "true"
  MONITOR_RELEASES: "true"
  MONITOR_WORKFLOWS: "true"

  # ---------------- COMMITS ----------------

  SHOW_COMMIT_DETAILS: "true"
  SHOW_AUTHOR: "true"
  SHOW_BRANCH: "true"
  SHOW_TIMESTAMP: "true"
  SHOW_LINKS: "true"

  MAX_COMMITS: "30"

  # ---------------- ARQUIVOS ----------------

  SHOW_FILE_LIST: "true"
  SHOW_FILE_DIFFS: "true"
  SHOW_FILE_STATS: "true"

  SHOW_ADDED_FILES: "true"
  SHOW_MODIFIED_FILES: "true"
  SHOW_DELETED_FILES: "true"
  SHOW_RENAMED_FILES: "true"

  # ---------------- FILTROS ----------------

  # Vazio = monitorar todas as pastas.
  # Exemplo: src/,scripts/,config/

  INCLUDE_PATHS: ""

  # Pastas que não devem ser monitoradas.
  IGNORE_PATHS: "node_modules/,dist/,build/,.git/,vendor/"

  # Extensões permitidas.
  # Vazio = todas as extensões.
  # Exemplo: .lua,.js,.py,.json

  INCLUDE_EXTENSIONS: ""

  # Extensões bloqueadas.
  EXCLUDE_EXTENSIONS: ".exe,.dll,.pdb"

  # Arquivos confidenciais.
  EXCLUDED_FILES: ".env,.env.local,secrets.json,credentials.json"

  # ---------------- HISTÓRICO ----------------

  SHOW_OLD_NEW: "true"
  SHOW_PREVIOUS_COMMIT: "true"
  SHOW_COMMIT_URL: "true"
  SHOW_FILE_URL: "true"

  # ---------------- RELATÓRIOS ----------------

  REPORT_MODE: "detailed"

  SHOW_SUMMARY: "true"
  SHOW_CHANGE_COUNTERS: "true"

  # ---------------- LIMITES ----------------

  MAX_FILES: "100"
  MAX_DIFF_CHARS: "10000"
  MAX_EMBEDS_PER_MESSAGE: "10"

  # ---------------- DISCORD ----------------

  MESSAGE_DELAY: "1200"

  # Cores decimais.
  COLOR_ADDED: "5763719"
  COLOR_MODIFIED: "16763904"
  COLOR_DELETED: "15548997"
  COLOR_RENAMED: "10181046"
  COLOR_GENERAL: "3447003"

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Audit Report
        uses: actions/github-script@v7

        with:
          script: |
            const p = context.payload;
            const event = context.eventName;
            const { owner, repo } = context.repo;
            const cfg = process.env;

            // ==================================================
            // CONFIGURAÇÕES INTERNAS
            // ==================================================

            const enabled = key =>
              cfg[key]?.toLowerCase() === "true";

            const number = (key, fallback) => {
              const n = Number(cfg[key]);
              return Number.isFinite(n) && n > 0 ? n : fallback;
            };

            const webhook = cfg.DISCORD_WEBHOOK;

            if (!webhook) {
              throw new Error("Webhook não configurado.");
            }

            const MAX_FILES = number("MAX_FILES", 100);
            const MAX_DIFF = number("MAX_DIFF_CHARS", 10000);
            const MAX_COMMITS = number("MAX_COMMITS", 30);
            const DELAY = number("MESSAGE_DELAY", 1200);
            const MAX_EMBEDS = Math.min(
              10,
              number("MAX_EMBEDS_PER_MESSAGE", 10)
            );

            const sleep = ms =>
              new Promise(resolve => setTimeout(resolve, ms));

            const colors = {
              added: number("COLOR_ADDED", 5763719),
              modified: number("COLOR_MODIFIED", 16763904),
              removed: number("COLOR_DELETED", 15548997),
              renamed: number("COLOR_RENAMED", 10181046),
              general: number("COLOR_GENERAL", 3447003)
            };

            // ==================================================
            // DISCORD
            // ==================================================

            async function sendEmbeds(embeds) {
              for (let i = 0; i < embeds.length; i += MAX_EMBEDS) {
                const batch = embeds.slice(i, i + MAX_EMBEDS);

                let response;

                for (let attempt = 0; attempt < 5; attempt++) {
                  response = await fetch(webhook, {
                    method: "POST",
                    headers: {
                      "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                      username: cfg.DISCORD_USERNAME,
                      embeds: batch
                    })
                  });

                  if (response.ok) break;

                  if (response.status === 429) {
                    const data = await response.json();
                    await sleep((data.retry_after || 2) * 1000);
                    continue;
                  }

                  throw new Error(
                    `Discord HTTP ${response.status}`
                  );
                }

                if (!response?.ok) {
                  throw new Error("Falha no envio ao Discord.");
                }

                await sleep(DELAY);
              }
            }

            function baseEmbed(title, description, color) {
              return {
                title: String(title).slice(0, 256),
                description: String(description || "").slice(0, 4000),
                color,
                timestamp: new Date().toISOString()
              };
            }

            // ==================================================
            // FILTROS
            // ==================================================

            const splitConfig = key =>
              (cfg[key] || "")
                .split(",")
                .map(x => x.trim().toLowerCase())
                .filter(Boolean);

            const includes = splitConfig("INCLUDE_PATHS");
            const ignored = splitConfig("IGNORE_PATHS");
            const allowedExtensions = splitConfig("INCLUDE_EXTENSIONS");
            const blockedExtensions = splitConfig("EXCLUDE_EXTENSIONS");
            const excludedFiles = splitConfig("EXCLUDED_FILES");

            function isAllowed(file) {
              const name = (file.filename || "").replaceAll("\\", "/");
              const lower = name.toLowerCase();

              if (excludedFiles.some(x => lower.endsWith(x))) {
                return false;
              }

              if (ignored.some(x => lower.startsWith(x))) {
                return false;
              }

              if (includes.length &&
                  !includes.some(x => lower.startsWith(x))) {
                return false;
              }

              const dot = lower.lastIndexOf(".");
              const extension = dot >= 0 ? lower.slice(dot) : "";

              if (blockedExtensions.includes(extension)) {
                return false;
              }

              if (allowedExtensions.length &&
                  !allowedExtensions.includes(extension)) {
                return false;
              }

              const status = file.status;

              if (status === "added" && !enabled("SHOW_ADDED_FILES"))
                return false;

              if (status === "modified" && !enabled("SHOW_MODIFIED_FILES"))
                return false;

              if (status === "removed" && !enabled("SHOW_DELETED_FILES"))
                return false;

              if (status === "renamed" && !enabled("SHOW_RENAMED_FILES"))
                return false;

              return true;
            }

            // ==================================================
            // LINKS E ESTATÍSTICAS
            // ==================================================

            function fileUrl(file, sha) {
              return `https://github.com/${owner}/${repo}/blob/${sha}/${encodeURI(file.filename)}`;
            }

            function summarize(files) {
              const result = {
                added: 0,
                modified: 0,
                removed: 0,
                renamed: 0,
                additions: 0,
                deletions: 0
              };

              for (const file of files) {
                if (result[file.status] !== undefined) {
                  result[file.status]++;
                }

                result.additions += file.additions || 0;
                result.deletions += file.deletions || 0;
              }

              return result;
            }

            // ==================================================
            // RELATÓRIO INDIVIDUAL DE ARQUIVO
            // ==================================================

            function fileEmbeds(file, sha, parentSha) {
              const result = [];

              const status = file.status;
              const color = colors[status] || colors.modified;

              let description = "";

              if (enabled("SHOW_FILE_STATS")) {
                description +=
                  `**Adições:** +${file.additions || 0}\n` +
                  `**Remoções:** -${file.deletions || 0}\n`;
              }

              if (enabled("SHOW_OLD_NEW")) {
                description +=
                  `**Versão anterior:** ${parentSha ? parentSha.slice(0, 8) : "Indisponível"}\n` +
                  `**Nova versão:** ${sha.slice(0, 8)}\n`;
              }

              if (file.previous_filename) {
                description +=
                  `**Nome anterior:** \`${file.previous_filename}\`\n`;
              }

              const links = [];

              if (enabled("SHOW_FILE_URL") && status !== "removed") {
                links.push(`[Arquivo novo](${fileUrl(file, sha)})`);
              }

              if (enabled("SHOW_FILE_URL") && parentSha &&
                  status !== "added") {
                links.push(
                  `[Arquivo anterior](${fileUrl(file, parentSha)})`
                );
              }

              if (links.length) {
                description += "\n" + links.join(" • ");
              }

              result.push(
                baseEmbed(
                  `${status.toUpperCase()} • ${file.filename}`,
                  description,
                  color
                )
              );

              if (enabled("SHOW_FILE_DIFFS") && file.patch) {
                let patch = file.patch.slice(0, MAX_DIFF);

                const lines = patch.split("\n");
                let current = "";

                for (const line of lines) {
                  if (current.length + line.length + 1 > 3500) {
                    result.push(
                      baseEmbed(
                        `DIFF • ${file.filename}`,
                        "```diff\n" + current + "\n```",
                        color
                      )
                    );

                    current = "";
                  }

                  current += (current ? "\n" : "") + line;
                }

                if (current) {
                  result.push(
                    baseEmbed(
                      `DIFF • ${file.filename}`,
                      "```diff\n" + current + "\n```",
                      color
                    )
                  );
                }

                if (file.patch.length > MAX_DIFF) {
                  result.push(
                    baseEmbed(
                      "DIFF LIMITADO",
                      `O patch ultrapassou MAX_DIFF_CHARS (${MAX_DIFF}).`,
                      colors.general
                    )
                  );
                }
              } else if (enabled("SHOW_FILE_DIFFS")) {
                result.push(
                  baseEmbed(
                    "DIFF INDISPONÍVEL",
                    "Arquivo binário, patch ausente ou não fornecido pela API.",
                    colors.general
                  )
                );
              }

              return result;
            }

            // ==================================================
            // RELATÓRIO DE COMMIT
            // ==================================================

            async function processCommit(sha, fallback) {
              const response = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: sha
              });

              const commit = response.data;
              const parentSha = commit.parents?.[0]?.sha;

              const files = (commit.files || []).filter(isAllowed);
              const stats = summarize(files);

              const message = commit.commit.message || "Sem mensagem";
              const author =
                commit.author?.login ||
                commit.commit.author?.name ||
                "Desconhecido";

              const branch = p.ref?.replace("refs/heads/", "") || "Desconhecida";

              let description = "";

              if (enabled("SHOW_COMMIT_DETAILS")) {
                description += `**Mensagem:** ${message.slice(0, 900)}\n`;
              }

              if (enabled("SHOW_AUTHOR")) {
                description += `**Autor:** ${author}\n`;
              }

              if (enabled("SHOW_BRANCH")) {
                description += `**Branch:** ${branch}\n`;
              }

              if (enabled("SHOW_TIMESTAMP")) {
                description += `**Data:** ${commit.commit.author?.date || "Indisponível"}\n`;
              }

              if (enabled("SHOW_PREVIOUS_COMMIT")) {
                description +=
                  `**Commit anterior:** ${parentSha || "Nenhum"}\n`;
              }

              if (enabled("SHOW_COMMIT_URL")) {
                description +=
                  `[Abrir commit](${commit.html_url})`;
              }

              const embeds = [
                baseEmbed(
                  `COMMIT • ${sha.slice(0, 8)}`,
                  description,
                  colors.general
                )
              ];

              if (enabled("SHOW_SUMMARY")) {
                embeds.push(
                  baseEmbed(
                    "RESUMO DAS ALTERAÇÕES",
                    `Arquivos: ${files.length}\n` +
                    `Adicionados: ${stats.added}\n` +
                    `Modificados: ${stats.modified}\n` +
                    `Excluídos: ${stats.removed}\n` +
                    `Renomeados: ${stats.renamed}\n` +
                    `Linhas adicionadas: +${stats.additions}\n` +
                    `Linhas removidas: -${stats.deletions}`,
                    colors.general
                  )
                );
              }

              if (enabled("SHOW_FILE_LIST")) {
                for (const file of files.slice(0, MAX_FILES)) {
                  embeds.push(
                    ...fileEmbeds(file, sha, parentSha)
                  );
                }
              }

              await sendEmbeds(embeds);

              if (commit.files?.length >= 300) {
                await sendEmbeds([
                  baseEmbed(
                    "AVISO DE LIMITE",
                    "A API do GitHub pode limitar os arquivos deste commit a 300. O relatório pode estar incompleto.",
                    colors.general
                  )
                ]);
              }

              if (files.length > MAX_FILES) {
                await sendEmbeds([
                  baseEmbed(
                    "ARQUIVOS NÃO EXIBIDOS",
                    `${files.length - MAX_FILES} arquivos excederam MAX_FILES.`,
                    colors.general
                  )
                ]);
              }
            }

            // ==================================================
            // PUSH: CADA COMMIT SEPARADAMENTE
            // ==================================================

            if (event === "push") {
              if (!enabled("MONITOR_PUSH")) return;

              const commits = p.commits || [];

              await sendEmbeds([
                baseEmbed(
                  "NOVO PUSH",
                  `**Repositório:** ${owner}/${repo}\n` +
                  `**Branch:** ${p.ref}\n` +
                  `**Commits recebidos:** ${commits.length}\n` +
                  `[Comparar alterações](${p.compare})`,
                  colors.general
                )
              ]);

              for (const commit of commits.slice(0, MAX_COMMITS)) {
                await processCommit(commit.id, commit);
              }

              if (commits.length > MAX_COMMITS) {
                await sendEmbeds([
                  baseEmbed(
                    "LIMITE DE COMMITS",
                    `${commits.length - MAX_COMMITS} commits não foram processados.`,
                    colors.general
                  )
                ]);
              }
            }

            // ==================================================
            // PULL REQUEST
            // ==================================================

            else if (event === "pull_request") {
              if (!enabled("MONITOR_PULL_REQUESTS")) return;

              const pr = p.pull_request;

              const files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number: pr.number,
                  per_page: 100
                }
              );

              const filtered = files.filter(isAllowed);
              const stats = summarize(filtered);

              const embeds = [
                baseEmbed(
                  `PULL REQUEST • ${p.action.toUpperCase()}`,
                  `**Título:** ${pr.title}\n` +
                  `**Autor:** ${pr.user.login}\n` +
                  `**Branch:** ${pr.head.ref} → ${pr.base.ref}\n` +
                  `**Arquivos:** ${filtered.length}\n` +
                  `**Adições:** +${stats.additions}\n` +
                  `**Remoções:** -${stats.deletions}\n` +
                  `[Abrir Pull Request](${pr.html_url})`,
                  colors.general
                )
              ];

              if (enabled("SHOW_FILE_LIST")) {
                for (const file of filtered.slice(0, MAX_FILES)) {
                  embeds.push(
                    ...fileEmbeds(
                      file,
                      pr.head.sha,
                      pr.base.sha
                    )
                  );
                }
              }

              await sendEmbeds(embeds);
            }

            // ==================================================
            // ISSUES
            // ==================================================

            else if (event === "issues") {
              if (!enabled("MONITOR_ISSUES")) return;

              const issue = p.issue;

              await sendEmbeds([
                baseEmbed(
                  `ISSUE • ${p.action.toUpperCase()}`,
                  `**Título:** ${issue.title}\n` +
                  `**Autor:** ${issue.user.login}\n` +
                  `[Abrir issue](${issue.html_url})`,
                  colors.general
                )
              ]);
            }

            // ==================================================
            // RELEASES
            // ==================================================

            else if (event === "release") {
              if (!enabled("MONITOR_RELEASES")) return;

              const release = p.release;

              await sendEmbeds([
                baseEmbed(
                  `RELEASE • ${release.tag_name}`,
                  `**Nome:** ${release.name || release.tag_name}\n` +
                  `**Autor:** ${release.author.login}\n` +
                  `**Descrição:** ${(release.body || "Sem descrição").slice(0, 3000)}\n` +
                  `[Abrir release](${release.html_url})`,
                  colors.general
                )
              ]);
            }

            // ==================================================
            // WORKFLOWS
            // ==================================================

            else if (event === "workflow_run") {
              if (!enabled("MONITOR_WORKFLOWS")) return;

              const run = p.workflow_run;

              await sendEmbeds([
                baseEmbed(
                  `WORKFLOW • ${(run.conclusion || run.status).toUpperCase()}`,
                  `**Nome:** ${run.name}\n` +
                  `**Branch:** ${run.head_branch}\n` +
                  `**Autor:** ${run.actor.login}\n` +
                  `[Abrir execução](${run.html_url})`,
                  run.conclusion === "success"
                    ? 5763719
                    : 15548997
                )
              ]);
            }
